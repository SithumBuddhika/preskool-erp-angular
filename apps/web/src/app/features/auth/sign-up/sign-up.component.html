<section class="auth-page">
  <div class="auth-page__visual">
    <img
      class="auth-page__illustration"
      src="/assets/images/auth/sign-up.png"
      alt="Sign up illustration"
    />

    <div class="auth-page__wave"></div>
  </div>

  <div class="auth-page__content">
    <div class="auth-shell">
      <div class="auth-brand">
        <img
          class="auth-brand__icon"
          src="/assets/logos/preskool-logo.png"
          alt="PreSkool logo"
        />

        <strong>PreSkool</strong>
      </div>

      <form
        class="auth-card"
        [formGroup]="signUpForm"
        (ngSubmit)="submitSignUp()"
      >
        <div class="auth-card__header">
          <h1>Sign Up</h1>
          <p>Please enter your details to create account</p>
        </div>

        <div class="social-row">
          <button
            type="button"
            class="social-btn social-btn--facebook"
            aria-label="Continue with Facebook"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M14 8.5V6.8c0-.8.2-1.3 1.3-1.3H17V2.4c-.8-.1-1.6-.2-2.4-.2-2.4 0-4 1.5-4 4.3v2H8v3.4h2.6V22H14V11.9h2.7l.4-3.4H14Z"
              />
            </svg>
          </button>

          <button
            type="button"
            class="social-btn social-btn--google"
            aria-label="Continue with Google"
          >
            <span class="google-icon">G</span>
          </button>

          <button
            type="button"
            class="social-btn social-btn--apple"
            aria-label="Continue with Apple"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M16.6 13.1c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.9-1.4-.1-2.8.8-3.5.8-.7 0-1.8-.8-3-.8-1.5 0-3 .9-3.8 2.2-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.7 2.4 2.9 2.3 1.2 0 1.6-.8 3-.8s1.8.8 3 .8c1.3 0 2.1-1.1 2.8-2.3.9-1.3 1.2-2.5 1.3-2.6-.1 0-2.5-1-2.5-3.5ZM14.3 6.2c.6-.7 1-1.7.9-2.7-.9 0-1.9.6-2.5 1.3-.6.7-1.1 1.7-1 2.7 1 0 2-.5 2.6-1.3Z"
              />
            </svg>
          </button>
        </div>

        <div class="divider">
          <span>OR</span>
        </div>

        <label class="form-field">
          <span>Name</span>

          <div class="form-field__control" [class.is-invalid]="fullNameInvalid">
            <input type="text" formControlName="fullName" />
            <span class="field-icon">👤</span>
          </div>

          @if (fullNameInvalid) {
            <small>Name is required and cannot contain numbers.</small>
          }
        </label>

        <label class="form-field">
          <span>Email Address</span>

          <div class="form-field__control" [class.is-invalid]="emailInvalid">
            <input type="email" formControlName="email" />
            <span class="field-icon">✉</span>
          </div>

          @if (emailInvalid) {
            <small>Please enter a valid email address.</small>
          }
        </label>

        <label class="form-field">
          <span>Password</span>

          <div class="form-field__control" [class.is-invalid]="passwordInvalid">
            <input
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
            />

            <button
              type="button"
              class="field-icon-btn"
              (click)="togglePassword()"
            >
              {{ showPassword ? 'Hide' : 'Show' }}
            </button>
          </div>

          @if (passwordInvalid) {
            <small>Password must be at least 7 characters.</small>
          }
        </label>

        <label class="form-field">
          <span>Confirm Password</span>

          <div
            class="form-field__control"
            [class.is-invalid]="confirmPasswordInvalid"
          >
            <input
              [type]="showConfirmPassword ? 'text' : 'password'"
              formControlName="confirmPassword"
            />

            <button
              type="button"
              class="field-icon-btn"
              (click)="toggleConfirmPassword()"
            >
              {{ showConfirmPassword ? 'Hide' : 'Show' }}
            </button>
          </div>

          @if (confirmPasswordInvalid) {
            <small>Passwords do not match.</small>
          }
        </label>

        <div class="auth-options">
          <label>
            <input type="checkbox" formControlName="agreeTerms" />
            <span>I agree to the Terms & Privacy</span>
          </label>
        </div>

        @if (termsInvalid) {
          <small class="terms-error"
            >Please accept the terms to continue.</small
          >
        }

        <button class="auth-submit-btn" type="submit">Sign Up</button>

        <p class="switch-auth">
          Already have an account?
          <a routerLink="/auth/login">Sign In</a>
        </p>
      </form>

      <p class="auth-footer">
        Copyright © 2026 - PreSkool | Sithum Buddhika Jayalal
      </p>
    </div>
  </div>
</section>
