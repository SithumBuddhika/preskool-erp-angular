<section class="reset-password-page">
  <div class="reset-password-page__visual">
    <img
      class="reset-password-page__illustration"
      src="/assets/images/auth/reset-password.png"
      alt="Reset password illustration"
    />

    <div class="reset-password-page__wave"></div>
  </div>

  <div class="reset-password-page__content">
    <div class="reset-shell">
      <div class="reset-brand">
        <img
          class="reset-brand__icon"
          src="/assets/logos/preskool-logo.png"
          alt="PreSkool logo"
        />

        <strong>PreSkool</strong>
      </div>

      <form
        class="reset-card"
        [formGroup]="resetForm"
        (ngSubmit)="submitResetPassword()"
      >
        <div class="reset-card__header">
          <h1>Reset Password?</h1>
          <p>Enter New Password & Confirm Password to get inside</p>
        </div>

        <label class="form-field">
          <span>New Password</span>

          <div class="form-field__control" [class.is-invalid]="passwordInvalid">
            <input
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
            />

            <button
              type="button"
              class="field-icon-btn"
              (click)="togglePassword()"
              aria-label="Toggle new password visibility"
            >
              {{ showPassword ? 'Hide' : 'Show' }}
            </button>
          </div>

          @if (passwordInvalid) {
            <small>Password must be at least 7 characters.</small>
          }
        </label>

        <label class="form-field">
          <span>New Confirm Password</span>

          <div
            class="form-field__control"
            [class.is-invalid]="confirmPasswordInvalid"
          >
            <input
              [type]="showConfirmPassword ? 'text' : 'password'"
              formControlName="confirmPassword"
            />

            <button
              type="button"
              class="field-icon-btn"
              (click)="toggleConfirmPassword()"
              aria-label="Toggle confirm password visibility"
            >
              {{ showConfirmPassword ? 'Hide' : 'Show' }}
            </button>
          </div>

          @if (confirmPasswordInvalid) {
            <small>Please confirm your new password.</small>
          }
        </label>

        @if (serverError()) {
          <p class="auth-server-error">{{ serverError() }}</p>
        }

        @if (successMessage()) {
          <p class="auth-success-message">{{ successMessage() }}</p>
        }

        <button
          class="change-password-btn"
          type="submit"
          [disabled]="isSubmitting() || !token()"
        >
          {{ isSubmitting() ? 'Changing Password...' : 'Change Password' }}
        </button>

        <p class="return-login">
          Return to <a routerLink="/auth/login">Log in</a>
        </p>
      </form>
    </div>

    <p class="reset-footer">Copyright © 2026 - PreSkool</p>
  </div>
</section>
