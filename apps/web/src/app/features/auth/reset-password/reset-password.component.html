<section class="reset-page">
  <div class="reset-card">
    <div class="reset-brand">
      <img src="/assets/logos/preskool-logo.png" alt="PreSkool logo" />
      <strong>PreSkool</strong>
    </div>

    <form
      class="reset-form"
      [formGroup]="resetForm"
      (ngSubmit)="submitResetPassword()"
    >
      <div class="reset-form__header">
        <span>Security</span>
        <h1>Reset Password</h1>
        <p>Create a new password for your PreSkool ERP account.</p>
      </div>

      <label class="form-field">
        <span>New Password</span>

        <div class="form-field__control" [class.is-invalid]="passwordInvalid">
          <input
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="Enter new password"
          />

          <button type="button" (click)="togglePassword()">
            {{ showPassword ? 'Hide' : 'Show' }}
          </button>
        </div>

        @if (passwordInvalid) {
          <small>Password must be at least 7 characters.</small>
        }
      </label>

      <label class="form-field">
        <span>Confirm Password</span>

        <div
          class="form-field__control"
          [class.is-invalid]="confirmPasswordInvalid"
        >
          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            formControlName="confirmPassword"
            placeholder="Confirm new password"
          />

          <button type="button" (click)="toggleConfirmPassword()">
            {{ showConfirmPassword ? 'Hide' : 'Show' }}
          </button>
        </div>

        @if (confirmPasswordInvalid) {
          <small>Please confirm your new password.</small>
        }
      </label>

      @if (serverError()) {
        <p class="auth-server-error">{{ serverError() }}</p>
      }

      @if (successMessage()) {
        <p class="auth-success-message">{{ successMessage() }}</p>
      }

      <button
        class="reset-submit-btn"
        type="submit"
        [disabled]="isSubmitting() || !token()"
      >
        {{ isSubmitting() ? 'Resetting...' : 'Reset Password' }}
      </button>

      <a routerLink="/auth/login" class="back-link">Back to Login</a>
    </form>
  </div>
</section>
