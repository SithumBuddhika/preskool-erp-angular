<section class="auth-page">
  <div class="auth-page__visual">
    <img
      class="auth-page__illustration"
      src="/assets/images/auth/reset-password.png"
      alt="Reset password illustration"
    />
    <div class="auth-page__wave"></div>
  </div>

  <div class="auth-page__content">
    <div class="auth-shell">
      <div class="auth-brand">
        <img
          class="auth-brand__icon"
          src="/assets/logos/preskool-logo.png"
          alt="PreSkool logo"
        />
        <strong>PreSkool</strong>
      </div>

      <form
        class="auth-card"
        [formGroup]="resetForm"
        (ngSubmit)="submitResetPassword()"
      >
        <div class="auth-card__header">
          <h1>Reset Password</h1>
          <p>Your new password must be at least 7 characters.</p>
        </div>

        <label class="form-field">
          <span>New Password</span>
          <div class="form-field__control" [class.is-invalid]="passwordInvalid">
            <input
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
            />
            <button
              type="button"
              class="field-icon-btn"
              (click)="togglePassword()"
            >
              {{ showPassword ? 'Hide' : 'Show' }}
            </button>
          </div>

          @if (passwordInvalid) {
            <small>Password must be at least 7 characters.</small>
          }
        </label>

        <label class="form-field">
          <span>Confirm Password</span>
          <div
            class="form-field__control"
            [class.is-invalid]="confirmPasswordInvalid"
          >
            <input
              [type]="showConfirmPassword ? 'text' : 'password'"
              formControlName="confirmPassword"
            />
            <button
              type="button"
              class="field-icon-btn"
              (click)="toggleConfirmPassword()"
            >
              {{ showConfirmPassword ? 'Hide' : 'Show' }}
            </button>
          </div>

          @if (confirmPasswordInvalid) {
            <small>Passwords do not match.</small>
          }
        </label>

        <button class="auth-submit-btn" type="submit">Reset Password</button>

        <p class="switch-auth">
          Back to
          <a routerLink="/auth/login">Sign In</a>
        </p>
      </form>

      <p class="auth-footer">
        Copyright © 2026 - PreSkool | Sithum Buddhika Jayalal
      </p>
    </div>
  </div>
</section>
