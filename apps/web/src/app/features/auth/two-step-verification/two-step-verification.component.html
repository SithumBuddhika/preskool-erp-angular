<section class="auth-page">
  <div class="auth-page__visual">
    <img
      class="auth-page__illustration"
      src="/assets/images/auth/two-step-verification.png"
      alt="Two step verification illustration"
    />
    <div class="auth-page__wave"></div>
  </div>

  <div class="auth-page__content">
    <div class="auth-shell">
      <div class="auth-brand">
        <img
          class="auth-brand__icon"
          src="/assets/logos/preskool-logo.png"
          alt="PreSkool logo"
        />
        <strong>PreSkool</strong>
      </div>

      <form
        class="auth-card"
        [formGroup]="twoStepForm"
        (ngSubmit)="submitTwoStep()"
      >
        <div class="auth-card__header">
          <h1>2 Step Verification</h1>
          <p>Enter the 6-digit authentication code to continue.</p>
        </div>

        <div class="otp-row">
          <input maxlength="1" formControlName="one" />
          <input maxlength="1" formControlName="two" />
          <input maxlength="1" formControlName="three" />
          <input maxlength="1" formControlName="four" />
          <input maxlength="1" formControlName="five" />
          <input maxlength="1" formControlName="six" />
        </div>

        <button class="auth-submit-btn" type="submit">Verify</button>

        <p class="switch-auth">
          Back to
          <a routerLink="/auth/login">Sign In</a>
        </p>
      </form>

      <p class="auth-footer">
        Copyright © 2026 - PreSkool | Sithum Buddhika Jayalal
      </p>
    </div>
  </div>
</section>
