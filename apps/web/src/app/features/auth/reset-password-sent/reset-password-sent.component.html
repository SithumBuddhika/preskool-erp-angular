<section class="auth-page">
  <div class="auth-page__visual">
    <img
      class="auth-page__illustration"
      src="/assets/images/auth/forgot-password.png"
      alt="Reset link sent illustration"
    />
    <div class="auth-page__wave"></div>
  </div>

  <div class="auth-page__content">
    <div class="auth-shell">
      <div class="auth-brand">
        <img
          class="auth-brand__icon"
          src="/assets/logos/preskool-logo.png"
          alt="PreSkool logo"
        />
        <strong>PreSkool</strong>
      </div>

      <div class="auth-card auth-card--center sent-card">
        <div class="success-animation" aria-hidden="true">
          <span class="success-animation__ring"></span>
          <span class="success-animation__circle">
            <svg viewBox="0 0 52 52">
              <path d="M14 27.5L23 36L39 17" />
            </svg>
          </span>
        </div>

        <div class="auth-card__header">
          <h1>Check Your Email</h1>
          <p>We sent a password reset link to your email address.</p>
        </div>

        <button class="auth-submit-btn" type="button" routerLink="/auth/login">
          Back to Sign In
        </button>
      </div>

      <p class="auth-footer">
        Copyright © 2026 - PreSkool | Sithum Buddhika Jayalal
      </p>
    </div>
  </div>
</section>
