<section class="auth-page">
  <div class="auth-page__visual">
    <img
      class="auth-page__illustration"
      src="/assets/images/auth/forgot-password.png"
      alt="Forgot password illustration"
    />
    <div class="auth-page__wave"></div>
  </div>

  <div class="auth-page__content">
    <div class="auth-shell">
      <div class="auth-brand">
        <img
          class="auth-brand__icon"
          src="/assets/logos/preskool-logo.png"
          alt="PreSkool logo"
        />
        <strong>PreSkool</strong>
      </div>

      <form
        class="auth-card"
        [formGroup]="forgotForm"
        (ngSubmit)="submitForgotPassword()"
      >
        <div class="auth-card__header">
          <h1>Forgot Password?</h1>
          <p>Enter your email address and we’ll send you reset instructions.</p>
        </div>

        <label class="form-field">
          <span>Email Address</span>
          <div class="form-field__control" [class.is-invalid]="emailInvalid">
            <input type="email" formControlName="email" />
            <span class="field-icon">✉</span>
          </div>

          @if (emailInvalid) {
            <small>Please enter a valid email address.</small>
          }
        </label>

        <button class="auth-submit-btn" type="submit">Send Reset Link</button>

        <p class="switch-auth">
          Remember password?
          <a routerLink="/auth/login">Sign In</a>
        </p>
      </form>

      <p class="auth-footer">
        Copyright © 2026 - PreSkool | Sithum Buddhika Jayalal
      </p>
    </div>
  </div>
</section>
