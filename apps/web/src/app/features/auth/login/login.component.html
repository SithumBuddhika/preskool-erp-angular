<section class="login-page">
  <div class="login-page__visual">
    <img
      class="login-page__illustration"
      src="/assets/images/auth/sign-in.png"
      alt="Sign in illustration"
    />

    <div class="login-page__wave"></div>
  </div>

  <div class="login-page__content">
    <div class="login-shell">
      <div class="login-brand">
        <img
          class="login-brand__icon"
          src="/assets/logos/preskool-logo.png"
          alt="PreSkool logo"
        />

        <strong>PreSkool</strong>
      </div>

      <form
        class="login-card"
        [formGroup]="loginForm"
        (ngSubmit)="submitLogin()"
      >
        <div class="login-card__header">
          <h1>Welcome</h1>
          <p>Please enter your details to sign in</p>
        </div>

        <div class="social-row">
          <button
            type="button"
            class="social-btn social-btn--facebook"
            aria-label="Continue with Facebook"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M14 8.5V6.8c0-.8.2-1.3 1.3-1.3H17V2.4c-.8-.1-1.6-.2-2.4-.2-2.4 0-4 1.5-4 4.3v2H8v3.4h2.6V22H14V11.9h2.7l.4-3.4H14Z"
              />
            </svg>
          </button>

          <button
            type="button"
            class="social-btn social-btn--google"
            aria-label="Continue with Google"
          >
            <span class="google-icon">G</span>
          </button>

          <button
            type="button"
            class="social-btn social-btn--apple"
            aria-label="Continue with Apple"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M16.6 13.1c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.9-1.4-.1-2.8.8-3.5.8-.7 0-1.8-.8-3-.8-1.5 0-3 .9-3.8 2.2-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.7 2.4 2.9 2.3 1.2 0 1.6-.8 3-.8s1.8.8 3 .8c1.3 0 2.1-1.1 2.8-2.3.9-1.3 1.2-2.5 1.3-2.6-.1 0-2.5-1-2.5-3.5ZM14.3 6.2c.6-.7 1-1.7.9-2.7-.9 0-1.9.6-2.5 1.3-.6.7-1.1 1.7-1 2.7 1 0 2-.5 2.6-1.3Z"
              />
            </svg>
          </button>
        </div>

        <div class="divider">
          <span>OR</span>
        </div>

        <label class="form-field">
          <span>Email Address</span>

          <div class="form-field__control" [class.is-invalid]="emailInvalid">
            <input type="email" formControlName="email" />
            <span class="field-icon">✉</span>
          </div>

          @if (emailInvalid) {
            <small>Please enter a valid email address.</small>
          }
        </label>

        <label class="form-field">
          <span>Password</span>

          <div class="form-field__control" [class.is-invalid]="passwordInvalid">
            <input
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
            />

            <button
              type="button"
              class="field-icon-btn"
              (click)="togglePassword()"
            >
              {{ showPassword ? 'Hide' : 'Show' }}
            </button>
          </div>

          @if (passwordInvalid) {
            <small>Password is required.</small>
          }
        </label>

        <div class="login-options">
          <label>
            <input type="checkbox" formControlName="rememberMe" />
            <span>Remember Me</span>
          </label>

          <a routerLink="/auth/forgot-password">Forgot Password?</a>
        </div>

        @if (serverError()) {
          <p class="auth-server-error">{{ serverError() }}</p>
        }

        <button class="sign-in-btn" type="submit" [disabled]="isSubmitting()">
          {{ isSubmitting() ? 'Signing In...' : 'Sign In' }}
        </button>

        <p class="create-account">
          Don’t have an account?
          <a routerLink="/auth/sign-up">Create Account</a>
        </p>
      </form>
    </div>

    <p class="login-footer">
      Copyright © 2026 - PreSkool | Sithum Buddhika Jayalal
    </p>
  </div>
</section>
