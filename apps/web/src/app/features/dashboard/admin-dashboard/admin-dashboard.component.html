<section class="admin-dashboard">
  <div class="admin-dashboard__title-row">
    <app-page-title title="Admin Dashboard" current="Admin Dashboard" />

    <div class="admin-dashboard__actions">
      <button type="button" class="primary-btn">Add New Student</button>
      <button type="button" class="secondary-btn">Fees Details</button>
    </div>
  </div>

  <app-payment-alert />

  <app-welcome-banner />

  <div class="admin-dashboard__stats">
    @for (card of statCards; track card.label) {
      <app-stat-card
        [short]="card.short"
        [label]="card.label"
        [value]="card.value"
        [badge]="card.badge"
        [active]="card.active"
        [inactive]="card.inactive"
        [color]="card.color"
      />
    }
  </div>

  <div class="admin-dashboard__grid">
    <app-widget-card
      title="Fees Collection"
      meta="Last 8 Quarter"
      [large]="true"
    >
      <div class="bar-chart">
        @for (bar of feeBars; track $index) {
          <div class="bar-chart__item">
            <div class="bar-chart__bar">
              <span [style.height.%]="bar.collected"></span>
            </div>
            <small>Q1 : 2023</small>
          </div>
        }
      </div>
    </app-widget-card>

    <app-widget-card title="Leave Requests" meta="This Week">
      <div class="leave-card">
        <div class="leave-card__avatar">J</div>
        <div>
          <strong>James</strong>
          <p>Physics Teacher</p>
          <small>Leave : 12 - 13 May</small>
        </div>
      </div>

      <div class="leave-card">
        <div class="leave-card__avatar is-pink">H</div>
        <div>
          <strong>Hendrita</strong>
          <p>Maths Teacher</p>
          <small>Leave : 17 - 18 May</small>
        </div>
      </div>
    </app-widget-card>

    <app-widget-card title="Schedules" meta="Add New">
      <div class="mini-calendar">
        @for (day of calendarDays; track $index) {
          <span [class.active]="day.active">{{ day.label }}</span>
        }
      </div>
    </app-widget-card>

    <app-widget-card title="Attendance" meta="Today">
      <div class="attendance-ring">
        <div>
          <strong>3610</strong>
          <span>Present</span>
        </div>
      </div>

      <button class="view-btn" type="button">View All</button>
    </app-widget-card>

    <app-widget-card title="Quick Links">
      <div class="quick-links">
        <button type="button">Calendar</button>
        <button type="button">Events</button>
        <button type="button">Attendance</button>
        <button type="button">Exams</button>
      </div>
    </app-widget-card>
  </div>
</section>
