services:
  postgres:
    image: postgres:16-alpine
    container_name: preskool_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: preskool_erp
    ports:
      - '5432:5432'
    volumes:
      - preskool_postgres_data:/var/lib/postgresql/data

volumes:
  preskool_postgres_data:
